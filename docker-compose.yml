version: "3.9"

# =============================================================================
# docker-compose.yml — LPhenom Cache development environment
#
# Services:
#   app    — PHP 8.1-alpine (composer, pdo_mysql, redis ext)
#   mysql  — MySQL 8.0.36
#   redis  — Redis 7.2-alpine
#
# Usage:
#   make up              # start services
#   make test            # run unit tests
#   make test-integration # run all tests (unit + integration)
#   make lint            # phpcs
#   make analyse         # phpstan
#   make down            # stop services
# =============================================================================

services:

  # ── PHP application container ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: cache_test
      DB_USER: cache
      DB_PASS: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"

  # ── MySQL 8.0 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cache_test
      MYSQL_USER: cache
      MYSQL_PASSWORD: secret
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "cache", "-psecret"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    tmpfs:
      - /var/lib/mysql   # in-memory for speed in dev

  # ── Redis 7.2 ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

