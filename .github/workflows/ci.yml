name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit:
    name: "PHP ${{ matrix.php }} — Unit"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout lphenom/cache
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse src/ --level=8 --no-progress

      - name: PHP_CodeSniffer
        run: vendor/bin/phpcs --standard=PSR12 src/ tests/

      - name: Unit Tests
        run: vendor/bin/phpunit --testsuite=Unit

  integration:
    name: "PHP ${{ matrix.php }} — Integration"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cache_test
          MYSQL_USER: cache
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u cache -psecret"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout lphenom/cache
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Integration Tests
        env:
          DB_HOST: "127.0.0.1"
          DB_PORT: "3306"
          DB_NAME: cache_test
          DB_USER: cache
          DB_PASS: secret
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: "6379"
        run: vendor/bin/phpunit --testsuite=Integration
